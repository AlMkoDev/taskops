<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Bean Production — WBS App</title>
<style>
  /* ── Dark theme CSS variable definitions (matching screenshots) ── */
  :root {
    --color-background-primary: #1e1e1e;
    --color-background-secondary: #2a2a2a;
    --color-background-info: #1a2d45;
    --color-text-primary: #e8e8e8;
    --color-text-secondary: #999999;
    --color-text-info: #5ba3f5;
    --color-text-success: #4caf6e;
    --color-border-tertiary: #3a3a3a;
    --color-border-secondary: #4a4a4a;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
    --border-radius-md: 8px;
    --border-radius-lg: 10px;
    --h: 48px;
    --phase-clr: #185FA5;
    --accent: #3B6D11;
    --warn: #BA7517;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--color-background-primary); color: var(--color-text-primary); }
  body { font-family: var(--font-sans); }

  #app { display: flex; height: 100vh; min-height: 600px; overflow: hidden; }

  /* Sidebar */
  #sidebar { width: 220px; min-width: 180px; border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; overflow: hidden; background: var(--color-background-secondary); }
  #sidebar-header { padding: 14px 14px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  #sidebar-header h1 { font-size: 13px; font-weight: 500; color: var(--color-text-primary); line-height: 1.3; }
  #sidebar-header p { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; }
  #nav { overflow-y: auto; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: 12px; color: var(--color-text-secondary); border-left: 2px solid transparent; transition: all .15s; }
  .nav-item:hover { background: var(--color-background-primary); color: var(--color-text-primary); }
  .nav-item.active { background: var(--color-background-primary); color: var(--color-text-info); border-left-color: var(--color-text-info); font-weight: 500; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #tabs { display: flex; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); padding: 0 16px; gap: 4px; }
  .tab { padding: 10px 14px; font-size: 12px; cursor: pointer; color: var(--color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -0.5px; transition: all .15s; font-weight: 400; }
  .tab:hover { color: var(--color-text-primary); }
  .tab.active { color: var(--color-text-info); border-bottom-color: var(--color-text-info); font-weight: 500; }
  #content { flex: 1; overflow-y: auto; padding: 16px; background: var(--color-background-primary); }

  /* Phase header */
  .phase-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .phase-badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--color-background-info); color: var(--color-text-info); }
  .phase-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
  .phase-meta { font-size: 12px; color: var(--color-text-secondary); margin-left: auto; }

  /* WBS Table */
  .wbs-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
  .wbs-table th { text-align: left; padding: 7px 10px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); }
  .wbs-table td { padding: 7px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); vertical-align: top; }
  .wbs-table tr:hover td { background: var(--color-background-secondary); }
  .wbs-id { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); white-space: nowrap; }

  /* Cadence pills */
  .cadence-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; font-weight: 500; }
  .c-fixed { background: #1a3050; color: #5ba3f5; }
  .c-stage { background: #1a2e10; color: #7bc44a; }
  .c-threshold { background: #2e2010; color: #e8a030; }
  .c-milestone { background: #22204a; color: #9b95e8; }
  .c-continuous { background: #2e1515; color: #e06060; }
  .cadence-icon { font-size: 11px; }

  .responsible-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--color-background-secondary); color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); }

  /* Gantt */
  #gantt-wrap { overflow-x: auto; }
  .gantt { width: 100%; border-collapse: collapse; font-size: 11px; }
  .gantt th { padding: 5px 6px; font-size: 10px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); white-space: nowrap; text-align: center; background: var(--color-background-secondary); }
  .gantt td { padding: 4px 6px; border-bottom: 0.5px solid var(--color-border-tertiary); vertical-align: middle; }
  .gantt tr:hover td { background: var(--color-background-secondary); }
  .g-bar { height: 16px; border-radius: 3px; display: block; min-width: 6px; }
  .g-blue { background: #378ADD; }
  .g-green { background: #639922; }
  .g-amber { background: #EF9F27; }
  .g-purple { background: #7F77DD; }
  .g-red { background: #E24B4A; }

  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .kpi-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .kpi-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); line-height: 1; }
  .kpi-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; }

  /* Overlap matrix */
  .og-head { font-size: 10px; font-weight: 500; padding: 6px 10px; background: var(--color-background-secondary); color: var(--color-text-secondary); }
  .og-cell { font-size: 11px; padding: 8px 12px; text-align: center; border: 0.5px solid var(--color-border-tertiary); }
  .og-low { background: #1a2e10; color: #7bc44a; }
  .og-mid { background: #2e2010; color: #e8a030; }
  .og-high { background: #2e2010; color: #e8a030; }
  .og-crit { background: #2e1515; color: #e06060; }

  /* Buffer table */
  .buf-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
  .buf-table th { padding: 7px 10px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); text-align: left; }
  .buf-table td { padding: 7px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); }
  .buf-bar { height: 8px; border-radius: 4px; display: inline-block; }

  /* Daily board */
  .day-section { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 14px; margin-bottom: 14px; }
  .day-section h3 { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .task-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 12px; color: var(--color-text-secondary); }
  .task-row:last-child { border-bottom: none; }
  .task-check { width: 14px; height: 14px; border-radius: 3px; border: 0.5px solid var(--color-border-secondary); flex-shrink: 0; cursor: pointer; transition: all .15s; }
  .task-check.done { background: var(--color-text-success); border-color: var(--color-text-success); }
  .task-text { flex: 1; }
  .task-text.done { text-decoration: line-through; opacity: .5; }
  .section-label { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; letter-spacing: .5px; }

  /* Cadence legend */
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

  /* Scrollbar styling for dark theme */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--color-background-primary); }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Sugar Bean Production</h1>
      <p>50ha · 5-6 month cycle</p>
    </div>
    <div id="nav"></div>
  </div>
  <div id="main">
    <div id="tabs">
      <div class="tab active" data-tab="tasks" onclick="switchTab('tasks')">WBS Tasks</div>
      <div class="tab" data-tab="gantt" onclick="switchTab('gantt')">Gantt</div>
      <div class="tab" data-tab="cadence" onclick="switchTab('cadence')">Cadence</div>
      <div class="tab" data-tab="daily" onclick="switchTab('daily')">Daily Board</div>
      <div class="tab" data-tab="kpi" onclick="switchTab('kpi')">KPIs</div>
    </div>
    <div id="content"></div>
  </div>
</div>
<script>
const PHASES=[
{id:1,name:"Project Mgmt & Planning",color:"#185FA5",dot:"#378ADD",weeks:[1,4],tasks:[
  {id:"1.1.1.a",name:"Market price & demand scan",desc:"Weekly price monitoring, trend alerts if >10% swing",cadence:"fixed",trigger:"Market volatility >5%",dur:"2 hrs/week",resp:"Marketing Officer"},
  {id:"1.1.1.b",name:"Buyer requirement mapping",desc:"Document quality specs, volume, delivery requirements per buyer",cadence:"milestone",trigger:"New contract or export channel",dur:"1-2 days",resp:"Marketing Officer"},
  {id:"1.1.2.a",name:"Yield/production target workshop",desc:"Define kg/ha goals, grade %, quality specs based on historical data",cadence:"milestone",trigger:"After buyer mapping complete",dur:"1-day workshop",resp:"Farm Manager"},
  {id:"1.1.3.a",name:"Draft budget iterations",desc:"3 cycles of costing: v1 → v2 → v3, aligned to input quotes",cadence:"fixed",trigger:"Input quotes received",dur:"9 days (3 cycles)",resp:"Accountant"},
  {id:"1.1.3.b",name:"Management budget approval",desc:"Final approved budget with contingency line signed off",cadence:"milestone",trigger:"All input quotes locked",dur:"2 days",resp:"Farm Manager/Board"},
  {id:"1.1.4.a",name:"Risk register mapping",desc:"Likelihood × impact matrix for production, market, climate risks",cadence:"milestone",trigger:"Enterprise scope finalised",dur:"1-day session",resp:"Risk Officer"},
  {id:"1.1.4.b",name:"Monthly risk review",desc:"Updated risk log, action items, weather/market reassessment",cadence:"fixed",trigger:"Last Friday of each month",dur:"1 hr/session",resp:"Management Team"},
  {id:"1.2.1",name:"Land use permits",desc:"Verify zoning, agricultural use rights, obtain permit approval",cadence:"milestone",trigger:"Prior to land preparation",dur:"1 week",resp:"Admin Officer"},
  {id:"1.2.2",name:"Environmental compliance",desc:"Water use licence, soil management plan, environmental clearance",cadence:"milestone",trigger:"Before ground breaking",dur:"2 weeks",resp:"Compliance Officer"},
  {id:"1.3.1",name:"Staff recruitment",desc:"Field workers, supervisors — employment contracts issued",cadence:"milestone",trigger:"Budget approved",dur:"1 week",resp:"HR Manager"},
  {id:"1.3.2",name:"Safety training",desc:"OHS, chemical handling, PPE compliance — records maintained",cadence:"milestone",trigger:"Before any field operations",dur:"3 days",resp:"Safety Officer"},
]},
{id:2,name:"Land Preparation",color:"#3B6D11",dot:"#639922",weeks:[2,6],tasks:[
  {id:"2.1.1.a",name:"Grid soil sampling (Z-pattern)",desc:"Collect samples at GPS points, test pH, NPK, organic matter",cadence:"milestone",trigger:"Field dry enough to walk; 14+ days before planting",dur:"1-2 days",resp:"Agronomist"},
  {id:"2.1.1.b",name:"Lab submission & tracking",desc:"Log samples, track results daily until receipt",cadence:"fixed",trigger:"Samples packed and dispatched",dur:"Daily until results",resp:"Agronomist"},
  {id:"2.1.2",name:"Topography & drainage mapping",desc:"GPS field contour map, drainage flow directions",cadence:"milestone",trigger:"Clear weather, GPS available",dur:"1-2 days",resp:"Surveyor"},
  {id:"2.3.1.a",name:"Daily equipment pre-check",desc:"Tractor/implement check, fluid levels, 05:30 daily",cadence:"fixed",trigger:"Before tillage begins each day",dur:"30 min/day",resp:"Mechanic/Operator"},
  {id:"2.3.1.b",name:"Primary plowing passes",desc:"Deep plowing 25-30cm, soil at field capacity",cadence:"stage",trigger:"Soil clearance & moisture at field capacity",dur:"2-5 days/10ha",resp:"Tractor Operator"},
  {id:"2.4.1.a",name:"Harrowing & levelling",desc:"Break clods, level surface to fine tilth",cadence:"milestone",trigger:"After plowing complete per block",dur:"1-2 days/10ha",resp:"Operator"},
  {id:"2.4.2",name:"Ridging / bed formation",desc:"Create planting rows at 75cm spacing",cadence:"milestone",trigger:"After harrowing",dur:"3 days",resp:"Tractor Operator"},
  {id:"2.5.1",name:"Soil amendment application",desc:"Apply lime if pH <5.5, or gypsum for compaction",cadence:"milestone",trigger:"Soil lab results received",dur:"2 days",resp:"Field Team"},
  {id:"2.5.2",name:"Basal fertilizer spread",desc:"Apply DAP or compound fertilizer 200-300 kg/ha",cadence:"milestone",trigger:"After soil amendments, before planting",dur:"2 days",resp:"Field Team"},
]},
{id:3,name:"Input Procurement",color:"#BA7517",dot:"#EF9F27",weeks:[1,5],tasks:[
  {id:"3.1.1",name:"Variety selection",desc:"Choose adapted variety (Sugar Bean III or local cultivar)",cadence:"milestone",trigger:"Market & agronomic review complete",dur:"2 days",resp:"Agronomist"},
  {id:"3.1.3",name:"Seed quality verification",desc:"Check germination rate >85%, purity certificate",cadence:"milestone",trigger:"Seed from approved supplier",dur:"3 days",resp:"Agronomist"},
  {id:"3.1.4",name:"Seed purchase & delivery",desc:"Order 100-120 kg/ha × 50ha = 5-6 tonnes total",cadence:"milestone",trigger:"Variety selected, budget approved",dur:"1 week",resp:"Procurement Officer"},
  {id:"3.2.1",name:"Basal fertilizer procurement",desc:"DAP or NPK — 10-15 tonnes for 50ha",cadence:"milestone",trigger:"Soil test results + planting plan",dur:"1 week",resp:"Procurement Officer"},
  {id:"3.2.2",name:"Top-dressing fertilizer",desc:"Urea or CAN — 5-8 tonnes",cadence:"milestone",trigger:"Before planting",dur:"1 week",resp:"Procurement Officer"},
  {id:"3.3.1",name:"Herbicide procurement",desc:"Pre-emergence & post-emergence — 200L",cadence:"milestone",trigger:"Based on agronomist weed risk assessment",dur:"5 days",resp:"Agronomist"},
  {id:"3.3.2",name:"Insecticide procurement",desc:"For aphids, beetles, pod borers — 150L",cadence:"milestone",trigger:"Based on historical pest pressure",dur:"5 days",resp:"Agronomist"},
  {id:"3.3.3",name:"Fungicide procurement",desc:"For rust and anthracnose — 100L",cadence:"milestone",trigger:"Based on disease risk assessment",dur:"5 days",resp:"Agronomist"},
  {id:"3.4.1",name:"Machinery check & service",desc:"Service tractors, planters, sprayers — records kept",cadence:"milestone",trigger:"Before planting season",dur:"1 week",resp:"Mechanic"},
  {id:"3.4.2",name:"Irrigation equipment setup",desc:"Pumps, pipes, sprinklers/drip ready and tested",cadence:"milestone",trigger:"Before first irrigation needed",dur:"2 weeks",resp:"Irrigation Tech"},
]},
{id:4,name:"Planting Operations",color:"#534AB7",dot:"#7F77DD",weeks:[5,8],tasks:[
  {id:"4.1.1",name:"Seed treatment",desc:"Inoculate with rhizobium, treat with fungicide before planting",cadence:"milestone",trigger:"24-48 hrs before planting day",dur:"2 days",resp:"Agronomist"},
  {id:"4.1.2",name:"Moisture assessment",desc:"Confirm soil moisture at planting depth (5-7 cm)",cadence:"threshold",trigger:"Soil moisture at field capacity",dur:"1 day",resp:"Agronomist"},
  {id:"4.1.3",name:"Planter calibration",desc:"Set seed rate 100-120 kg/ha, row spacing 75cm × 10cm",cadence:"milestone",trigger:"Day before planting begins",dur:"1 day",resp:"Mechanic"},
  {id:"4.2.1",name:"Mechanical planting",desc:"Precision planter at 5-7 cm depth — 8 operating days",cadence:"stage",trigger:"Soil moisture cleared, equipment calibrated",dur:"8 days",resp:"Tractor Operator"},
  {id:"4.2.2",name:"Manual planting (irregular areas)",desc:"Hand plant in headlands and irregular terrain",cadence:"stage",trigger:"Parallel to mechanical planting",dur:"5 days",resp:"Labor Team"},
  {id:"4.2.3",name:"Planting density check",desc:"Verify 150,000-200,000 plants/ha stand count",cadence:"continuous",trigger:"Ongoing during and after planting",dur:"Ongoing",resp:"Agronomist"},
  {id:"4.3.1",name:"Pre-emergence herbicide",desc:"Apply within 2 days of planting for weed-free emergence",cadence:"threshold",trigger:"Within 48 hrs of planting per block",dur:"3 days",resp:"Sprayer Operator"},
  {id:"4.3.3",name:"Gap filling",desc:"Replant missing areas after 7-10 days",cadence:"stage",trigger:"Stand count shows <80% emergence",dur:"3 days",resp:"Labor Team"},
]},
{id:5,name:"Crop Management",color:"#0F6E56",dot:"#1D9E75",weeks:[8,18],tasks:[

  {id:"5.2.2",name:"Foliar feeding",desc:"Spray micronutrients Zn, B, Mo at pod set",cadence:"stage",trigger:"R3 pod set stage",dur:"2 days",resp:"Sprayer Operator"},
  {id:"5.3.1",name:"Irrigation scheduling",desc:"Monitor soil moisture, weather, set weekly irrigation plan",cadence:"fixed",trigger:"Twice weekly (Mon & Thu) moisture checks",dur:"Ongoing",resp:"Agronomist"},
  {id:"5.3.2",name:"Critical stage irrigation",desc:"Flowering and pod filling — irrigate every 7-10 days if dry",cadence:"threshold",trigger:"Soil moisture below 40% field capacity",dur:"6 weeks",resp:"Irrigation Team"},
  {id:"5.3.3",name:"Irrigation system maintenance",desc:"Check pumps, pipes, emitters weekly",cadence:"fixed",trigger:"Weekly schedule",dur:"2 hrs/week",resp:"Irrigation Tech"},
  {id:"5.4.1",name:"Growth stage tracking",desc:"Document V1, V2, R1, R5 phenological stages",cadence:"fixed",trigger:"Weekly field scouting",dur:"Weekly",resp:"Agronomist"},
  {id:"5.4.2",name:"Stand assessment",desc:"Plant count per m², uniformity check",cadence:"fixed",trigger:"At 2, 4, and 6 WAP",dur:"Half-day per occasion",resp:"Agronomist"},
]},
{id:6,name:"Pest & Disease Control",color:"#993C1D",dot:"#D85A30",weeks:[8,22],tasks:[
  {id:"6.1.1",name:"Insect pest monitoring",desc:"Aphids, beetles, pod borers, thrips — pest count sheets",cadence:"fixed",trigger:"Twice weekly scouting",dur:"2 hrs/session",resp:"Scout"},
  {id:"6.1.2",name:"Disease surveillance",desc:"Rust, anthracnose, bacterial blight — incidence %",cadence:"fixed",trigger:"Weekly field inspection",dur:"2 hrs/session",resp:"Agronomist"},
  {id:"6.2.1",name:"Threshold-based insecticide spray",desc:"Apply when economic threshold reached — 3-4 applications",cadence:"threshold",trigger:"Pest count exceeds economic threshold",dur:"Per application",resp:"Sprayer Operator"},
  {id:"6.2.2",name:"Fungicide application",desc:"Preventive sprays at flowering and pod fill",cadence:"stage",trigger:"R1 flowering and R3 pod set",dur:"2-3 applications",resp:"Sprayer Operator"},
  {id:"6.3.1",name:"Chemical rotation log",desc:"Alternate active ingredients to prevent resistance",cadence:"continuous",trigger:"After each spray application",dur:"Ongoing",resp:"Agronomist"},
  {id:"6.3.2",name:"Spray efficacy checks",desc:"Assess pest/disease control 3-5 days post-application",cadence:"fixed",trigger:"3-5 days after each spray",dur:"1 hr/check",resp:"Agronomist"},
]},
{id:7,name:"Harvest Operations",color:"#993556",dot:"#D4537E",weeks:[20,24],tasks:[

  {id:"7.2.3.c",name:"End-of-day weighing & quality check",desc:"Scale reading, rejection log if >5% substandard",cadence:"fixed",trigger:"Daily at 16:00",dur:"1 hr/day",resp:"QC + Store Clerk"},
  {id:"7.3.1",name:"Field bagging & labelling",desc:"Fill 50kg bags, label with date and field number",cadence:"continuous",trigger:"Ongoing during harvest",dur:"Ongoing",resp:"Labor Team"},
  {id:"7.3.3",name:"Weighbridge records",desc:"Weight per field per day logged",cadence:"continuous",trigger:"Each truck load",resp:"Weighbridge Operator",dur:"Ongoing"},
]},
{id:8,name:"Post-Harvest Handling",color:"#3C3489",dot:"#7F77DD",weeks:[22,26],tasks:[
  {id:"8.1.1.a",name:"Initial cleaning & FMD removal",desc:"Conveyor cleaning — target <1% foreign matter",cadence:"continuous",trigger:"Product on cleaning line",dur:"2-4 hrs/day",resp:"Machine Operator"},

  {id:"8.2.2.b",name:"Turning / aeration schedule",desc:"2-3× per day sun drying, continuous mechanical",cadence:"fixed",trigger:"Temperature/moisture gradient detected",dur:"30 min/turn",resp:"Labor/Dryer Op"},
  {id:"8.3.1.a",name:"Batch sampling & lab submission",desc:"Per 5-tonne lot after drying target met",cadence:"milestone",trigger:"Moisture target reached",dur:"1 hr + 24h lab",resp:"QC + Lab Tech"},
  {id:"8.4.1.b",name:"Packaging & labelling",desc:"Grade, weight, date, batch number on all bags",cadence:"continuous",trigger:"Batch lab approval received",dur:"2-4 hrs/day",resp:"Packaging Team"},
]},
{id:9,name:"Storage & Warehousing",color:"#5F5E5A",dot:"#888780",weeks:[23,28],tasks:[
  {id:"9.1.1.a",name:"Facility sanitation & pest seal",desc:"Sweep, fumigate, seal gaps before first delivery",cadence:"milestone",trigger:"Before first stock intake",dur:"1 day",resp:"Warehouse Team"},
  {id:"9.3.1.a",name:"Climate & humidity logging",desc:"Temperature <25°C, RH <65% — twice daily",cadence:"fixed",trigger:"08:00 and 16:00 daily",dur:"10 min/reading",resp:"Facility Tech"},
  {id:"9.3.2.b",name:"Pest trap inspection",desc:"Every Monday — traps at 10m intervals",cadence:"fixed",trigger:"Weekly schedule",dur:"30 min",resp:"Pest Control"},
  {id:"9.3.3.c",name:"FIFO stock rotation",desc:"Every Friday — oldest batch moved forward",cadence:"fixed",trigger:"After each new intake",dur:"2 hrs",resp:"Warehouse + QC"},
  {id:"9.3.4.d",name:"Cycle count & system reconciliation",desc:"Last day of month — variance target <1%",cadence:"fixed",trigger:"Monthly",dur:"1 day",resp:"Accountant + Clerk"},
]},
{id:10,name:"Marketing & Sales",color:"#185FA5",dot:"#378ADD",weeks:[4,28],tasks:[
  {id:"10.1.1.a",name:"Buyer pipeline update",desc:"CRM/sales sheet review every Wednesday",cadence:"fixed",trigger:"Weekly",dur:"1 hr/week",resp:"Sales Officer"},
  {id:"10.1.2",name:"Price negotiation & contracting",desc:"Secure volume, quality specs, delivery schedule",cadence:"milestone",trigger:"Product samples approved by buyer",dur:"1 week",resp:"Farm Manager/Sales"},
  {id:"10.2.1.b",name:"Order confirmation & dispatch",desc:"Per buyer PO — dispatch plan and truck assigned",cadence:"milestone",trigger:"Stock available, PO received",dur:"2 hrs/order",resp:"Logistics"},
  {id:"10.3.1.a",name:"Pre-loading quality & weight check",desc:"Load manifest, photo evidence — per truck",cadence:"fixed",trigger:"2 hrs before each dispatch",dur:"30 min/truck",resp:"QC + Driver"},
  {id:"10.4.1.c",name:"Invoice issuance & AR follow-up",desc:"Invoice within 24h of POD; weekly AR aging review",cadence:"fixed",trigger:"After signed POD; every Friday",dur:"1 hr/day + 2 hrs/week",resp:"Accountant"},
]},
{id:11,name:"Monitoring & Evaluation",color:"#3C3489",dot:"#7F77DD",weeks:[1,28],tasks:[
  {id:"11.1.1.a",name:"KPI dashboard data pull",desc:"ERP + field logs + sales data synced every Monday",cadence:"fixed",trigger:"Weekly Monday",dur:"2 hrs",resp:"M&E Officer"},
  {id:"11.1.2.b",name:"Variance analysis meeting",desc:"Budget vs actual — bi-weekly Thursday",cadence:"fixed",trigger:"Every 2 weeks",dur:"1 hr",resp:"Management Team"},
  {id:"11.2.1.c",name:"Field log consolidation",desc:"Daily at 17:00 — missing data flagged",cadence:"fixed",trigger:"After all shifts end",dur:"30 min",resp:"Admin Officer"},
  {id:"11.3.1.a",name:"Financial close & ROI calculation",desc:"P&L, cost/kg, ROI% — 30 days post-harvest",cadence:"milestone",trigger:"30 days after all sales settled",dur:"3 days",resp:"Accountant"},
  {id:"11.3.2.b",name:"Technical review & lesson capture",desc:"Agronomic performance, variety results, next-cycle improvements",cadence:"milestone",trigger:"21 days post-harvest",dur:"1-day workshop",resp:"Technical Lead"},
  {id:"11.3.3.c",name:"Next-cycle plan draft",desc:"Apply lessons to updated business plan v1.0",cadence:"milestone",trigger:"30 days post-harvest",dur:"5 days",resp:"Farm Manager"},
]},
];

const CADENCE={
  fixed:{label:"Fixed Rhythm",icon:"🔁",cls:"c-fixed"},
  stage:{label:"Stage-Triggered",icon:"🌱",cls:"c-stage"},
  threshold:{label:"Threshold",icon:"⚡",cls:"c-threshold"},
  milestone:{label:"Milestone-Gated",icon:"📍",cls:"c-milestone"},
  continuous:{label:"Continuous",icon:"🔄",cls:"c-continuous"},
};

const WEEK_LABELS=Array.from({length:24},(_,i)=>`W${i+1}`);
let activePhase=1, activeTab="tasks";

function buildNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML="";
  PHASES.forEach(p=>{
    const d=document.createElement("div");
    d.className="nav-item"+(activePhase===p.id?" active":"");
    d.innerHTML=`<span class="nav-dot" style="background:${p.dot}"></span><span>${p.id}. ${p.name}</span>`;
    d.onclick=()=>{activePhase=p.id;buildNav();renderContent()};
    nav.appendChild(d);
  });
}

function switchTab(t){
  activeTab=t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab===t));
  renderContent();
}

function renderContent(){
  const c=document.getElementById("content");
  if(activeTab==="tasks") renderTasks(c);
  else if(activeTab==="gantt") renderGantt(c);
  else if(activeTab==="cadence") renderCadence(c);
  else if(activeTab==="daily") renderDaily(c);
  else if(activeTab==="kpi") renderKPI(c);
}

function cadencePill(type){
  const cd=CADENCE[type]||CADENCE.milestone;
  return `<span class="cadence-pill ${cd.cls}"><span class="cadence-icon">${cd.icon}</span>${cd.label}</span>`;
}

function renderTasks(c){
  const p=PHASES.find(x=>x.id===activePhase);
  c.innerHTML=`
  <div class="phase-header">
    <span class="phase-badge">${p.id}.0</span>
    <span class="phase-title">${p.name}</span>
    <span class="phase-meta">Weeks ${p.weeks[0]}–${p.weeks[1]} &nbsp;·&nbsp; ${p.tasks.length} tasks</span>
  </div>
  <div class="legend">
    ${Object.entries(CADENCE).map(([k,v])=>`<span class="cadence-pill ${v.cls}"><span class="cadence-icon">${v.icon}</span>${v.label}</span>`).join("")}
  </div>
  <table class="wbs-table">
    <thead><tr><th>WBS ID</th><th>Task</th><th>Description</th><th>Cadence</th><th>Trigger/Condition</th><th>Duration</th><th>Responsible</th></tr></thead>
    <tbody>
    ${p.tasks.map(t=>`<tr>
      <td><span class="wbs-id">${t.id}</span></td>
      <td style="font-weight:500;color:var(--color-text-primary);min-width:160px">${t.name}</td>
      <td style="min-width:200px;color:var(--color-text-secondary)">${t.desc}</td>
      <td>${cadencePill(t.cadence)}</td>
      <td style="font-size:11px;color:var(--color-text-secondary);min-width:140px">${t.trigger||"—"}</td>
      <td style="font-size:11px;white-space:nowrap">${t.dur||"—"}</td>
      <td><span class="responsible-tag">${t.resp}</span></td>
    </tr>`).join("")}
    </tbody>
  </table>`;
}

function renderGantt(c){
  const GANTT_COLORS={1:"g-blue",2:"g-green",3:"g-amber",4:"g-purple",5:"g-green",6:"g-red",7:"g-red",8:"g-purple",9:"g-blue",10:"g-blue",11:"g-purple"};
  c.innerHTML=`<div id="gantt-wrap">
  <div style="margin-bottom:12px">
    <p style="font-size:13px;font-weight:500;margin-bottom:4px">Project Timeline — All Phases (24 Weeks)</p>
    <p style="font-size:12px;color:var(--color-text-secondary)">Colored bars indicate active weeks per phase. Bar width = duration proportion.</p>
  </div>
  <table class="gantt">
    <thead>
      <tr>
        <th style="text-align:left;min-width:160px">Phase</th>
        ${WEEK_LABELS.map(w=>`<th>${w}</th>`).join("")}
      </tr>
    </thead>
    <tbody>
    ${PHASES.map(p=>{
      const cols=WEEK_LABELS.map((_,i)=>{
        const w=i+1;
        const active=w>=p.weeks[0]&&w<=p.weeks[1];
        return `<td style="padding:4px 2px">${active?`<span class="g-bar ${GANTT_COLORS[p.id]}" style="width:100%;opacity:0.85"></span>`:""}</td>`;
      }).join("");
      return `<tr><td style="font-size:11px;font-weight:500;padding:5px 8px">${p.id}. ${p.name}</td>${cols}</tr>`;
    }).join("")}
    </tbody>
  </table>
  </div>`;
}

function renderCadence(c){
  const types=["fixed","stage","threshold","milestone","continuous"];
  const labels=["Fixed 🔁","Stage 🌱","Threshold ⚡","Milestone 📍","Continuous 🔄"];
  const risk=[
    ["✅ Low","⚠️ Coord.","⚠️⚠️ High","✅ Low","⚠️ Coord."],
    ["⚠️ Coord.","✅ Low","⚠️⚠️ High","⚠️⚠️ High","⚠️ Coord."],
    ["⚠️⚠️ High","⚠️⚠️ High","🚫 Avoid","⚠️⚠️ High","⚠️⚠️ High"],
    ["✅ Low","⚠️⚠️ High","⚠️⚠️ High","✅ Low","⚠️ Coord."],
    ["⚠️ Coord.","⚠️ Coord.","⚠️⚠️ High","⚠️ Coord.","✅ Low"],
  ];
  const riskCls=(v)=>v.includes("Avoid")?"og-crit":v.includes("⚠️⚠️")?"og-high":v.includes("⚠️")?"og-mid":"og-low";
  const buffers=[
    {type:"🔁 Fixed Rhythm",buf:"0-10%",place:"End of task block",color:"#378ADD"},
    {type:"🌱 Stage-Triggered",buf:"15-25%",place:"Before AND after",color:"#639922"},
    {type:"⚡ Threshold",buf:"10-20%",place:"After trigger activation",color:"#EF9F27"},
    {type:"📍 Milestone-Gated",buf:"5-15%",place:"At approval gate",color:"#7F77DD"},
    {type:"🔄 Continuous",buf:"Built-in",place:"Real-time adjustment",color:"#E24B4A"},
  ];
  c.innerHTML=`
  <p style="font-size:14px;font-weight:500;margin-bottom:14px">Cadence Overlap Risk Matrix</p>
  <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:14px">Use this matrix to assess risk when task types coincide. Plan scheduling to avoid high-conflict overlaps.</p>
  <div style="overflow-x:auto;margin-bottom:24px">
  <table style="border-collapse:collapse;font-size:11px">
    <thead>
      <tr>
        <th class="og-head" style="border:0.5px solid var(--color-border-tertiary)"></th>
        ${labels.map(l=>`<th class="og-head" style="border:0.5px solid var(--color-border-tertiary)">${l}</th>`).join("")}
      </tr>
    </thead>
    <tbody>
      ${types.map((t,i)=>`<tr>
        <td class="og-head" style="border:0.5px solid var(--color-border-tertiary);white-space:nowrap">${labels[i]}</td>
        ${risk[i].map(v=>`<td class="og-cell ${riskCls(v)}">${v}</td>`).join("")}
      </tr>`).join("")}
    </tbody>
  </table>
  </div>
  <p style="font-size:14px;font-weight:500;margin-bottom:14px">Buffer Allocation Strategy</p>
  <table class="buf-table">
    <thead><tr><th>Task Type</th><th>Recommended Buffer</th><th>Visual</th><th>Placement</th></tr></thead>
    <tbody>
    ${buffers.map(b=>`<tr>
      <td style="font-weight:500">${b.type}</td>
      <td>${b.buf}</td>
      <td><span class="buf-bar" style="background:${b.color};width:${b.buf==="Built-in"?40:parseInt(b.buf)*2}px"></span></td>
      <td style="color:var(--color-text-secondary);font-size:11px">${b.place}</td>
    </tr>`).join("")}
    </tbody>
  </table>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px;font-size:12px">
    <p style="font-weight:500;margin-bottom:8px">Cadence Handoff Protocol</p>
    <p style="color:var(--color-text-secondary);margin-bottom:6px">When a 🌱 Stage task triggers a ⚡ Threshold response:</p>
    ${["Stage task owner logs milestone completion","System notifies Threshold task owner","Threshold owner has [X] hrs to acknowledge readiness","If no acknowledgment → escalate to Farm Manager","Both owners sign off on post-execution efficacy check"].map((s,i)=>`<div style="display:flex;gap:8px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span style="width:20px;height:20px;border-radius:50%;background:var(--color-background-info);color:var(--color-text-info);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span><span style="color:var(--color-text-secondary)">${s}</span></div>`).join("")}
  </div>`;
}

function renderDaily(c){
  const today=new Date().toLocaleDateString("en-ZA",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const dailySections=[
    {time:"05:30 AM",label:"Morning Fixed Tasks",clr:"#378ADD",tasks:[
      {id:"2.3.1.a",text:"Equipment pre-check — fluids, implements, tractor readiness"},
      {id:"5.3.1",text:"Soil moisture check — log readings, update irrigation plan"},
      {id:"7.2.1.a",text:"Set daily harvest quota — weather + equipment availability"},
    ]},
    {time:"07:00–12:00",label:"Field Operations",clr:"#639922",tasks:[
      {id:"5.1.1",text:"Weed scouting — note species, density, hot spots"},
      {id:"6.1.1",text:"Insect pest monitoring — check aphid, pod borer, beetle counts"},
      {id:"5.3.2",text:"Irrigation check — confirm emitters, flow rates, coverage"},
    ]},
    {time:"12:00–16:00",label:"Threshold / Triggered Actions",clr:"#EF9F27",tasks:[
      {id:"6.2.1",text:"Threshold spray if pest count exceeds economic threshold"},
      {id:"4.3.1",text:"Pre-emergence herbicide — if within 48hrs of planting block"},
      {id:"8.2.1.a",text:"Moisture test — drying product every 4 hrs (days 1-3)"},
    ]},
    {time:"16:00 PM",label:"End-of-Day Verification",clr:"#7F77DD",tasks:[
      {id:"7.2.3.c",text:"End-of-day weighing — record daily yield, rejection log"},
      {id:"11.2.1.c",text:"Field log consolidation — ensure all supervisors submitted"},
      {id:"9.3.1.a",text:"Warehouse climate log — temperature and humidity reading"},
    ]},
  ];
  c.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <p style="font-size:14px;font-weight:500">Daily Execution Board</p>
      <p style="font-size:12px;color:var(--color-text-secondary)">${today}</p>
    </div>
    <div style="font-size:11px;color:var(--color-text-secondary)">Click checkboxes to track completion</div>
  </div>
  ${dailySections.map(s=>`
  <div class="day-section">
    <h3><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${s.clr}"></span><span class="section-label" style="color:${s.clr}">${s.time}</span>${s.label}</h3>
    ${s.tasks.map(t=>`
    <div class="task-row" id="row-${t.id.replace(/\./g,'-')}">
      <div class="task-check" id="chk-${t.id.replace(/\./g,'-')}" onclick="toggleCheck('${t.id.replace(/\./g,'-')}')"></div>
      <span class="wbs-id">${t.id}</span>
      <span class="task-text" id="txt-${t.id.replace(/\./g,'-')}">${t.text}</span>
    </div>`).join("")}
  </div>`).join("")}`;
}

function toggleCheck(id){
  const chk=document.getElementById("chk-"+id);
  const txt=document.getElementById("txt-"+id);
  const done=chk.classList.toggle("done");
  txt.classList.toggle("done",done);
}

function renderKPI(c){
  const kpis=[
    {label:"Total Hectares",value:"50",sub:"Production area"},
    {label:"Total Tasks",value:"120+",sub:"Across 11 phases"},
    {label:"Cycle Duration",value:"24 wk",sub:"Planting to sale"},
    {label:"Seed Requirement",value:"5–6 t",sub:"100-120 kg/ha"},
    {label:"Target Yield",value:"2.0–2.5 t",sub:"Per hectare"},
    {label:"Harvest Crew",value:"30–40",sub:"Workers needed"},
    {label:"Critical Phases",value:"5",sub:"On critical path"},
    {label:"Time Contingency",value:"+20%",sub:"Stage/threshold tasks"},
  ];
  const critPath=[
    "Seed quality verification → germination rate >85%",
    "Rhizobium inoculation → nitrogen fixation performance",
    "Pre-emergence herbicide timing → weed-free establishment",
    "Irrigation at flowering and pod fill → yield realisation",
    "Harvest moisture control → quality grade and storage safety",
    "Post-harvest cleaning and drying → market acceptance",
  ];
  const phases_summary=PHASES.map(p=>({name:p.name,tasks:p.tasks.length,weeks:`W${p.weeks[0]}–W${p.weeks[1]}`,dot:p.dot}));
  c.innerHTML=`
  <p style="font-size:14px;font-weight:500;margin-bottom:14px">Enterprise KPIs & Summary</p>
  <div class="kpi-grid">
    ${kpis.map(k=>`<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub">${k.sub}</div></div>`).join("")}
  </div>
  <p style="font-size:14px;font-weight:500;margin-bottom:10px">Critical Path — Key Dependencies</p>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:20px">
    ${critPath.map((p,i)=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px">
      <span style="color:var(--color-text-info);font-weight:500;flex-shrink:0">${i+1}</span>
      <span style="color:var(--color-text-secondary)">${p}</span>
    </div>`).join("")}
  </div>
  <p style="font-size:14px;font-weight:500;margin-bottom:10px">Phase Summary</p>
  <table class="wbs-table">
    <thead><tr><th>Phase</th><th>Name</th><th>Weeks</th><th>Tasks</th></tr></thead>
    <tbody>
    ${phases_summary.map(p=>`<tr>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.dot};margin-right:6px"></span></td>
      <td style="font-weight:500">${p.name}</td>
      <td><span style="font-size:11px;padding:2px 7px;border-radius:3px;background:var(--color-background-secondary)">${p.weeks}</span></td>
      <td>${p.tasks}</td>
    </tr>`).join("")}
    </tbody>
  </table>`;
}

buildNav();
renderContent();
</script>
</body>
</html>
