# Prometheus Configuration
# This file tells Prometheus where to scrape metrics from

global:
  scrape_interval: 15s     # How often to scrape targets
  evaluation_interval: 15s # How often to evaluate rules
  scrape_timeout: 10s      # Timeout for scraping

# Scrape configurations
scrape_configs:
  # ============================================================
  # AgriReports Application
  # ============================================================
  - job_name: 'agrireports-app'
    scrape_interval: 10s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          environment: 'development'
          service: 'agrireports-api'

  # ============================================================
  # AgriReports Application (Production)
  # ============================================================
  - job_name: 'agrireports-app-production'
    scrape_interval: 15s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['agrireports-app:3000']
        labels:
          environment: 'production'
          service: 'agrireports-api'
    # Only enable in production
    # tls_config:
    #   insecure_skip_verify: false
    # bearer_token: 'your-secret-token'

  # ============================================================
  # Prometheus Self-Monitoring
  # ============================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ============================================================
  # Node Exporter (System Metrics)
  # ============================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
          environment: 'development'

  # ============================================================
  # Redis Exporter (Redis Metrics)
  # ============================================================
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis-exporter'

# Alerting rules (optional)
# rule_files:
#   - 'alert_rules.yml'

