databases:
  - name: taskops-db
    databaseName: taskops
    user: taskops
    plan: free
    region: oregon

services:
  - type: web
    name: taskops
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      echo "Starting clean build..."
      rm -rf node_modules .next
      echo "Installing dependencies..."
      npm install --legacy-peer-deps
      echo "Building application..."
      npm run build
      echo "Build complete!"
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskops-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: taskops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          name: taskops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: POSTGRES_SSL
        value: "true"
      - key: USE_NOTIFICATION_QUEUE
        value: "false"
