databases:
  - name: taskops-db
    databaseName: taskops
    user: taskops
    plan: free
    region: oregon

services:
  - type: web
    name: taskops
    runtime: node
    region: oregon
    plan: free
    buildCommand: rm -rf node_modules .next && npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskops-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: taskops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          name: taskops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: POSTGRES_SSL
        value: "true"
      - key: USE_NOTIFICATION_QUEUE
        value: "false"
